<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Camera Broadcaster</title>
<style>
  body { margin:0; background:#111; color:#eee; font-family: system-ui, sans-serif; }
  #video { width:100%; max-height:70vh; background:#000; }
  .bar { padding:12px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input { flex:1; min-width:140px; padding:10px; border-radius:8px; border:1px solid #444; background:#222; color:#eee; }
  button { padding:10px 14px; border-radius:8px; border:none; background:#3b82f6; color:white; font-weight:600; }
  button:disabled { background:#555; }
  #status { padding:0 12px 12px; font-size:14px; opacity:0.85; }
  .ok { color:#4ade80; }
  .err { color:#f87171; }
</style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <div class="bar">
    <input id="key" type="password" placeholder="Broadcaster key">
    <input id="server" type="text" placeholder="wss://your-server.example.com">
    <button id="connectBtn">Start Broadcasting</button>
    <button id="switchBtn">Switch Camera</button>
  </div>
  <div id="status">Not connected.</div>

<script>
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const connectBtn = document.getElementById('connectBtn');
const switchBtn = document.getElementById('switchBtn');
const keyInput = document.getElementById('key');
const serverInput = document.getElementById('server');

let ws, localStream;
let facingMode = 'environment'; // back camera by default
const peerConnections = new Map(); // viewerId -> RTCPeerConnection

const iceServers = [
  { urls: 'stun:stun.l.google.com:19302' }
  // If connections fail on cellular data, add a TURN server here, e.g.:
  // { urls: 'turn:your-turn-host:3478', username: 'user', credential: 'pass' }
];

function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = kind || '';
}

async function startCamera() {
  localStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode },
    audio: false
  });
  video.srcObject = localStream;
}

async function connect() {
  const key = keyInput.value.trim();
  const serverUrl = serverInput.value.trim();
  if (!key || !serverUrl) { setStatus('Enter key and server address.', 'err'); return; }

  await startCamera();

  ws = new WebSocket(serverUrl);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'register-broadcaster', key }));
  };

  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'registered') {
      setStatus('Broadcasting. Waiting for viewers...', 'ok');
    } else if (msg.type === 'error') {
      setStatus('Error: ' + msg.message, 'err');
    } else if (msg.type === 'viewer-joined') {
      await handleNewViewer(msg.viewerId);
    } else if (msg.type === 'answer') {
      const pc = peerConnections.get(msg.viewerId);
      if (pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    } else if (msg.type === 'ice-candidate') {
      const pc = peerConnections.get(msg.viewerId);
      if (pc && msg.candidate) await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
    } else if (msg.type === 'viewer-left') {
      const pc = peerConnections.get(msg.viewerId);
      if (pc) { pc.close(); peerConnections.delete(msg.viewerId); }
    }
  };

  ws.onclose = () => setStatus('Disconnected from server.', 'err');
  ws.onerror = () => setStatus('Connection error.', 'err');
}

async function handleNewViewer(viewerId) {
  const pc = new RTCPeerConnection({ iceServers });
  peerConnections.set(viewerId, pc);

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      ws.send(JSON.stringify({ type: 'ice-candidate', viewerId, candidate: e.candidate }));
    }
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  ws.send(JSON.stringify({ type: 'offer', viewerId, sdp: offer }));
}

async function switchCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  const oldStream = localStream;
  localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: false });
  video.srcObject = localStream;

  const newTrack = localStream.getVideoTracks()[0];
  for (const pc of peerConnections.values()) {
    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if (sender) sender.replaceTrack(newTrack);
  }
  if (oldStream) oldStream.getTracks().forEach(t => t.stop());
}

connectBtn.addEventListener('click', () => {
  connectBtn.disabled = true;
  connect().catch(err => { setStatus('Failed: ' + err.message, 'err'); connectBtn.disabled = false; });
});
switchBtn.addEventListener('click', () => switchCamera().catch(err => setStatus('Switch failed: ' + err.message, 'err')));
</script>
</body>
</html>
